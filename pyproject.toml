[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-alarm"
version = "0.2.0"
description = "A lightweight, dependency-free crypto price alert app"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Crypto Alarm" }]
keywords = ["crypto", "bitcoin", "price", "alerts", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crypto-alarm = "crypto_alarm.cli:main"

[tool.setuptools]
packages = ["crypto_alarm"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
